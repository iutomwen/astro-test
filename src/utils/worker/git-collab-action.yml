# File: site-frontend/.github/workflows/orchestrator.yml
name: Content Sync Orchestrator

on:
  repository_dispatch:
    # This matches the event_type payload we will configure in DatoCMS
    types: [datocms_webhook]

jobs:
  trigger_parallel_builds:
    name: Dispatching to ${{ matrix.repo }}
    runs-on: ubuntu-latest
    strategy:
      # This forces GitHub to spin up separate runners at the exact same time
      matrix:
        repo: ['my-company/site-frontend', 'my-company/site-docs']
    steps:
      - name: Dispatch Event
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.CROSS_REPO_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://github.com{{ matrix.repo }}/dispatches \
            -d '{"event_type": "datocms_publish"}'
